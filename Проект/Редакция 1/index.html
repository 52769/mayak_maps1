<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Интерактивная карта</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
  --bg: #ffffff;
  --text: #000000;
  --accent: #2AABEE;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

#topbar {
  display: flex;
  gap: 8px;
  padding: 10px;
  overflow-x: auto;
  background: var(--bg);
  border-bottom: 1px solid #ddd;
}

.filter-btn {
  padding: 6px 12px;
  border-radius: 20px;
  border: none;
  background: #eee;
  cursor: pointer;
}

.filter-btn.active {
  background: var(--accent);
  color: white;
}

#map-wrapper {
  position: relative;
  width: 100%;
  height: calc(100vh - 50px);
  overflow: hidden;
  touch-action: none;
}

#map-container {
  position: absolute;
  transform-origin: 0 0;
}

#map {
  width: 100%;
  display: block;
}

.point {
  position: absolute;
  width: 34px;
  height: 34px;
  transform: translate(-50%, -50%);
  cursor: pointer;
}

.point.completed {
  filter: grayscale(100%);
  opacity: 0.5;
}

.locked {
  opacity: 0.3;
}

#zoom-controls {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.zoom-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: white;
  font-size: 20px;
  cursor: pointer;
}

#modal {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: var(--bg);
  border-radius: 20px 20px 0 0;
  padding: 20px;
  box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
  display: none;
}

#modal h2 {
  margin-top: 0;
}

.modal-btn {
  margin-top: 10px;
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: var(--accent);
  color: white;
  width: 100%;
}
</style>
</head>
<body>

<div id="topbar">
  <button class="filter-btn active" data-type="all">Все</button>
  <button class="filter-btn" data-type="quest">Квест</button>
  <button class="filter-btn" data-type="info">Инфо</button>
  <button class="filter-btn" data-type="live">Проживание</button>
</div>

<div id="map-wrapper">
  <div id="map-container">
    <img src="assets/map.svg" id="map">
    <div id="points-layer"></div>
  </div>
</div>

<div id="zoom-controls">
  <button class="zoom-btn" onclick="zoom(1.2)">+</button>
  <button class="zoom-btn" onclick="zoom(0.8)">−</button>
</div>

<div id="modal">
  <h2 id="modal-title"></h2>
  <p id="modal-desc"></p>
  <button id="complete-btn" class="modal-btn">Отметить как пройдено</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

document.documentElement.style.setProperty('--bg', tg.themeParams.bg_color || '#fff');
document.documentElement.style.setProperty('--text', tg.themeParams.text_color || '#000');
document.documentElement.style.setProperty('--accent', tg.themeParams.button_color || '#2AABEE');

const pointsData = [
  {id:1, title:"Шатёр образования", desc:"Лекции и мастер-классы", x:40, y:30, type:"info"},
  {id:2, title:"Квест 1", desc:"Получите первое задание", x:60, y:55, type:"quest", unlock:"2026-02-12T10:00:00"},
  {id:3, title:"Корпус проживания", desc:"Место проживания участников", x:20, y:70, type:"live"}
];

let completed = JSON.parse(localStorage.getItem("completed") || "[]");
let currentFilter = "all";
let currentPoint = null;

const layer = document.getElementById("points-layer");

function renderPoints() {
  layer.innerHTML = "";
  pointsData.forEach(p => {

    if(currentFilter !== "all" && p.type !== currentFilter) return;

    const now = new Date();
    const unlockTime = p.unlock ? new Date(p.unlock) : null;
    const locked = unlockTime && now < unlockTime;

    const el = document.createElement("img");
    el.src = "assets/icons/" + p.type + ".png";
    el.className = "point";
    el.style.left = p.x + "%";
    el.style.top = p.y + "%";

    if(completed.includes(p.id)) el.classList.add("completed");
    if(locked) el.classList.add("locked");

    el.onclick = () => {
      if(locked) {
        alert("Точка откроется позже");
        return;
      }
      openModal(p);
    };

    layer.appendChild(el);
  });
}

function openModal(point) {
  currentPoint = point;
  document.getElementById("modal-title").innerText = point.title;
  document.getElementById("modal-desc").innerText = point.desc;
  document.getElementById("modal").style.display = "block";
}

document.getElementById("complete-btn").onclick = () => {
  if(!completed.includes(currentPoint.id)) {
    completed.push(currentPoint.id);
    localStorage.setItem("completed", JSON.stringify(completed));
  }
  document.getElementById("modal").style.display = "none";
  renderPoints();
};

document.querySelectorAll(".filter-btn").forEach(btn=>{
  btn.onclick = () => {
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.type;
    renderPoints();
  }
});

/* Zoom + Drag */
let scale = 1;
let posX = 0;
let posY = 0;
let startX, startY;
let isDragging = false;

const container = document.getElementById("map-container");
const wrapper = document.getElementById("map-wrapper");

function updateTransform(){
  container.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
}

function zoom(factor){
  scale *= factor;
  scale = Math.min(Math.max(scale, 0.5), 3);
  updateTransform();
}

wrapper.addEventListener("wheel", e=>{
  e.preventDefault();
  zoom(e.deltaY < 0 ? 1.1 : 0.9);
});

wrapper.addEventListener("mousedown", e=>{
  isDragging = true;
  startX = e.clientX - posX;
  startY = e.clientY - posY;
});

window.addEventListener("mouseup", ()=> isDragging=false);

window.addEventListener("mousemove", e=>{
  if(!isDragging) return;
  posX = e.clientX - startX;
  posY = e.clientY - startY;
  updateTransform();
});

renderPoints();
</script>

</body>
</html>
