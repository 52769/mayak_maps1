<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-редактор карты</title>

<style>
body { margin:0; font-family:Arial; display:flex; height:100vh; overflow:hidden; }

/* Sidebar */
#sidebar {
  width:320px;
  background:#f4f6f9;
  padding:15px;
  box-sizing:border-box;
  overflow-y:auto;
  border-right:1px solid #ddd;
}

h3 { margin-top:10px; }

input, select {
  width:100%;
  padding:6px;
  margin-bottom:8px;
  box-sizing:border-box;
}

button {
  width:100%;
  padding:8px;
  margin-bottom:8px;
  border:none;
  border-radius:6px;
  background:#2AABEE;
  color:white;
  cursor:pointer;
}

button.secondary { background:#888; }
button.red { background:#e74c3c; }

.point-item {
  padding:6px;
  background:white;
  margin-bottom:5px;
  border-radius:6px;
  cursor:pointer;
}

.point-item.active { background:#d0ebff; }

/* Map */
#map-wrapper {
  flex:1;
  position:relative;
  overflow:hidden;
  background:#ddd;
  cursor:grab;
}

#map-container {
  position:absolute;
  transform-origin:0 0;
}

#map {
  display:block;
  user-select:none;
  pointer-events:none;
}

.point {
  position:absolute;
  width:36px;
  height:36px;
  transform:translate(-50%,-50%);
  cursor:pointer;
}

.point.selected {
  outline:3px solid yellow;
  border-radius:50%;
}

/* Grid */
.grid-line {
  position:absolute;
  background:rgba(0,0,0,0.1);
}
</style>
</head>
<body>

<div id="sidebar">
  <h3>➕ Добавить</h3>
  <button id="addBtn">Режим добавления</button>

  <h3>✏ Редактор точки</h3>
  <input id="titleInput" placeholder="Название">
  <select id="typeInput">
    <option value="quest">Квест</option>
    <option value="info">Инфо</option>
    <option value="live">Проживание</option>
    <option value="finish">Финиш</option>
  </select>
  <input id="unlockInput" type="datetime-local">
  <button id="savePoint">Сохранить изменения</button>
  <button id="deletePoint" class="red">Удалить точку</button>

  <h3>⚙ Инструменты</h3>
  <button id="toggleGrid">Сетка</button>
  <button id="undoBtn" class="secondary">Undo</button>
  <button id="redoBtn" class="secondary">Redo</button>

  <h3>💾 Данные</h3>
  <button id="exportBtn">Экспорт JSON</button>
  <input type="file" id="importFile">
  
  <h3>📍 Список точек</h3>
  <div id="pointsList"></div>
</div>

<div id="map-wrapper">
  <div id="map-container">
    <img src="assets/map.png" id="map">
    <div id="grid"></div>
    <div id="points-layer"></div>
  </div>
</div>

<script>
let points = [];
let selectedPoint = null;
let addMode = false;
let history = [];
let redoStack = [];
let gridEnabled = false;

const layer = document.getElementById("points-layer");
const list = document.getElementById("pointsList");
const wrapper = document.getElementById("map-wrapper");
const container = document.getElementById("map-container");
const grid = document.getElementById("grid");

/* =============================
   🧠 HISTORY
============================= */
function pushHistory() {
  history.push(JSON.stringify(points));
  if (history.length > 100) history.shift();
  redoStack = [];
}

function undo() {
  if (history.length === 0) return;
  redoStack.push(JSON.stringify(points));
  points = JSON.parse(history.pop());
  selectedPoint = null;
  render();
}

function redo() {
  if (redoStack.length === 0) return;
  history.push(JSON.stringify(points));
  points = JSON.parse(redoStack.pop());
  selectedPoint = null;
  render();
}

/* =============================
   🗺 RENDER
============================= */
function render() {
  layer.innerHTML = "";
  list.innerHTML = "";

  points.forEach(p => {

    const el = document.createElement("img");
    el.src = "assets/icons/" + p.type + ".png";
    el.className = "point";
    el.style.left = p.x + "%";
    el.style.top = p.y + "%";

    if (selectedPoint === p.id)
      el.classList.add("selected");

    el.onmousedown = e => startDrag(e, p);

    el.onclick = e => {
      e.stopPropagation();
      selectPoint(p.id);
    };

    layer.appendChild(el);

    const item = document.createElement("div");
    item.className = "point-item";
    if (selectedPoint === p.id)
      item.classList.add("active");

    item.innerText = p.title || "Без названия";
    item.onclick = () => selectPoint(p.id);
    list.appendChild(item);
  });
}

/* =============================
   📍 SELECT
============================= */
function selectPoint(id) {
  selectedPoint = id;
  const p = points.find(pt => pt.id === id);
  if (!p) return;

  document.getElementById("titleInput").value = p.title || "";
  document.getElementById("typeInput").value = p.type;
  document.getElementById("unlockInput").value = p.unlock || "";
  render();
}

/* =============================
   ➕ ADD MODE
============================= */
document.getElementById("addBtn").onclick = () => {
  addMode = !addMode;
  wrapper.style.cursor = addMode ? "crosshair" : "grab";
};

wrapper.addEventListener("click", e => {
  if (!addMode) return;

  pushHistory();

  const rect = container.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 100;
  const y = ((e.clientY - rect.top) / rect.height) * 100;

  const id = Date.now();

  points.push({
    id,
    title: "Новая точка",
    type: "quest",
    x,
    y
  });

  selectPoint(id);
  render();
});

/* =============================
   ✋ DRAG
============================= */
function startDrag(e, point) {
  e.stopPropagation();
  pushHistory();

  function move(ev) {
    const rect = container.getBoundingClientRect();
    let x = ((ev.clientX - rect.left) / rect.width) * 100;
    let y = ((ev.clientY - rect.top) / rect.height) * 100;

    if (gridEnabled) {
      x = Math.round(x / 2) * 2;
      y = Math.round(y / 2) * 2;
    }

    point.x = x;
    point.y = y;
    render();
  }

  function stop() {
    window.removeEventListener("mousemove", move);
    window.removeEventListener("mouseup", stop);
  }

  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", stop);
}

/* =============================
   ✏ SAVE / DELETE
============================= */
document.getElementById("savePoint").onclick = () => {
  const p = points.find(pt => pt.id === selectedPoint);
  if (!p) return;

  pushHistory();

  p.title = document.getElementById("titleInput").value;
  p.type = document.getElementById("typeInput").value;
  p.unlock = document.getElementById("unlockInput").value;

  render();
};

document.getElementById("deletePoint").onclick = () => {
  if (!selectedPoint) return;

  pushHistory();

  points = points.filter(p => p.id !== selectedPoint);
  selectedPoint = null;
  render();
};

/* =============================
   🧲 GRID
============================= */
document.getElementById("toggleGrid").onclick = () => {
  gridEnabled = !gridEnabled;
  drawGrid();
};

function drawGrid() {
  grid.innerHTML = "";
  if (!gridEnabled) return;

  grid.style.position = "absolute";
  grid.style.width = "100%";
  grid.style.height = "100%";

  for (let i = 0; i <= 100; i += 5) {

    const v = document.createElement("div");
    v.className = "grid-line";
    v.style.left = i + "%";
    v.style.top = "0";
    v.style.width = "1px";
    v.style.height = "100%";
    grid.appendChild(v);

    const h = document.createElement("div");
    h.className = "grid-line";
    h.style.top = i + "%";
    h.style.left = "0";
    h.style.height = "1px";
    h.style.width = "100%";
    grid.appendChild(h);
  }
}

/* =============================
   💾 EXPORT / IMPORT
============================= */
document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(points, null, 2)], {
    type: "application/json"
  });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "points.json";
  a.click();
};

document.getElementById("importFile").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    points = JSON.parse(reader.result);
    selectedPoint = null;
    history = [];
    redoStack = [];
    render();
  };
  reader.readAsText(file);
};

/* =============================
   🔄 UNDO REDO BUTTONS
============================= */
document.getElementById("undoBtn").onclick = undo;
document.getElementById("redoBtn").onclick = redo;

/* =============================
   🔍 ZOOM + PAN
============================= */
let scale = 1, posX = 0, posY = 0;
let isDrag = false, startX, startY;

function updateTransform() {
  container.style.transform =
    `translate(${posX}px,${posY}px) scale(${scale})`;
}

wrapper.onwheel = e => {
  e.preventDefault();
  scale += e.deltaY < 0 ? 0.1 : -0.1;
  scale = Math.min(Math.max(scale, 0.5), 3);
  updateTransform();
};

wrapper.onmousedown = e => {
  if (addMode) return;
  isDrag = true;
  startX = e.clientX - posX;
  startY = e.clientY - posY;
};

window.onmousemove = e => {
  if (!isDrag) return;
  posX = e.clientX - startX;
  posY = e.clientY - startY;
  updateTransform();
};

window.onmouseup = () => isDrag = false;

render();
</script>

</body>
</html>
