<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Админ панель</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#f4f6f9;
}

header {
  padding:15px;
  background:#2AABEE;
  color:white;
  font-size:20px;
  font-weight:bold;
}

.section {
  padding:15px;
}

.card {
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

button {
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#2AABEE;
  color:white;
  margin-top:5px;
}

button.red {
  background:#ff4d4f;
}

.team-title {
  font-weight:bold;
  margin-bottom:8px;
}

.progress {
  height:8px;
  background:#eee;
  border-radius:4px;
  margin-top:5px;
}

.progress-bar {
  height:8px;
  background:#2AABEE;
  border-radius:4px;
}
</style>
</head>
<body>

<header>Админ-панель квеста</header>

<div class="section">

  <h3>🏆 Рейтинг команд</h3>
  <div id="rating"></div>

  <h3>👥 Команды</h3>
  <div id="teams"></div>

  <h3>📍 Управление точками</h3>
  <div id="points"></div>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

/* =======================
   🔗 API URL (указать свой)
========================= */
const API = "https://your-backend-url.com/api";

/* =======================
   📦 Загрузка данных
========================= */

async function loadData() {
  const teams = await fetch(API + "/teams").then(r=>r.json());
  const points = await fetch(API + "/points").then(r=>r.json());
  const rating = await fetch(API + "/rating").then(r=>r.json());

  renderTeams(teams, points);
  renderPoints(points);
  renderRating(rating);
}

/* =======================
   🏆 Рейтинг
========================= */

function renderRating(rating){
  const container = document.getElementById("rating");
  container.innerHTML = "";

  rating.forEach((team, index)=>{
    container.innerHTML += `
      <div class="card">
        ${index+1}. <b>${team.name}</b> — ${team.score} очков
      </div>
    `;
  });
}

/* =======================
   👥 Команды
========================= */

function renderTeams(teams, points){
  const container = document.getElementById("teams");
  container.innerHTML = "";

  teams.forEach(team=>{
    const percent = Math.round((team.completed.length / points.length)*100);

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="team-title">${team.name}</div>
      Пройдено: ${team.completed.length} / ${points.length}
      <div class="progress">
        <div class="progress-bar" style="width:${percent}%"></div>
      </div>
      <button onclick="resetTeam(${team.id})" class="red">Сбросить прогресс</button>
    `;

    container.appendChild(card);
  });
}

async function resetTeam(teamId){
  await fetch(API + "/teams/" + teamId + "/reset", {method:"POST"});
  loadData();
}

/* =======================
   📍 Точки
========================= */

function renderPoints(points){
  const container = document.getElementById("points");
  container.innerHTML = "";

  points.forEach(point=>{
    const locked = point.locked;

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <b>${point.title}</b><br/>
      Статус: ${locked ? "🔒 Закрыта" : "🔓 Открыта"}<br/>
      <button onclick="togglePoint(${point.id}, ${locked})">
        ${locked ? "Открыть" : "Закрыть"}
      </button>
    `;

    container.appendChild(card);
  });
}

async function togglePoint(id, locked){
  await fetch(API + "/points/" + id + "/toggle", {
    method:"POST"
  });
  loadData();
}

/* =======================
   🚀 INIT
========================= */

loadData();
</script>

</body>
</html>
