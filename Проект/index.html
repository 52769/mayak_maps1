<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Интерактивная карта</title>

<!-- Telegram WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Стили -->
<link rel="stylesheet" href="styles.css" />
</head>

<body>

<!-- =========================
     🧭 Верхняя панель фильтров
========================= -->
<div id="topbar">
  <button class="filter-btn active" data-type="all">Все</button>
  <button class="filter-btn" data-type="quest">Квест</button>
  <button class="filter-btn" data-type="info">Инфо</button>
  <button class="filter-btn" data-type="live">Проживание</button>
  <button class="filter-btn" data-type="finish">Финиш</button>
</div>

<!-- =========================
     🗺 Карта
========================= -->
<div id="map-wrapper">
  <div id="map-container">

    <!-- ДОЛЖЕН совпадать с admin-editor -->
    <img src="assets/map.svg" id="map" alt="Карта" />

    <!-- Слой точек -->
    <div id="points-layer"></div>

  </div>
</div>

<!-- =========================
     🔍 Zoom-кнопки
========================= -->
<div id="zoom-controls">
  <button class="zoom-btn">+</button>
  <button class="zoom-btn">−</button>
</div>

<!-- =========================
     📄 Модальное окно точки
========================= -->
<div id="modal">
  <h2 id="modal-title"></h2>
  <p id="modal-desc"></p>

  <button id="complete-btn" class="modal-btn">
    Отметить как пройдено
  </button>
</div>

<!-- =========================
     🚀 Основная логика
========================= -->
<script src="main.js"></script>

</body>
</html>
