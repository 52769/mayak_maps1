<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>Интерактивная карта</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="styles.css" />

<style>
#team-info {
  color: #000;
  font-size: 14px;
}

.point {
  position: absolute;
  width: 18px;
  height: 18px;
  background: #2AABEE;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  cursor: pointer;
}

#debug {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  max-height: 35%;
  overflow: auto;
  background: black;
  color: lime;
  font-size: 11px;
  z-index: 9999;
  padding: 6px;
}
</style>
</head>

<body>

<div id="topbar">
  <div id="team-info"></div>

  <div id="filters">
    <button class="filter-btn active" data-type="all">Все</button>
    <button class="filter-btn" data-type="quest">Квест</button>
    <button class="filter-btn" data-type="info">Инфо</button>
    <button class="filter-btn" data-type="live">Проживание</button>
    <button class="filter-btn" data-type="finish">Финиш</button>
  </div>
</div>

<div id="map-wrapper">
  <div id="map-container">
    <img src="assets/map.svg" id="map" alt="Карта">
    <div id="points-layer"></div>
  </div>
</div>

<div id="zoom-controls">
  <button class="zoom-btn">+</button>
  <button class="zoom-btn">−</button>
</div>

<div id="modal" style="display:none;">
  <h2 id="modal-title"></h2>
  <p id="modal-desc"></p>
  <div id="modal-meta"></div>

  <button id="complete-btn">Отметить как пройдено</button>
  <button id="close-btn">Закрыть</button>
</div>

<script src="main.js"></script>

<div id="debug"></div>

<script>
window.onerror = function(msg, url, line) {
  const debug = document.getElementById("debug");
  debug.innerHTML += `<div>❌ ${msg} (line ${line})</div>`;
};
</script>

</body>
</html>
