<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>Интерактивная карта</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="styles.css?v=2" />
</head>

<body>

<!-- =========================
     🧭 Верхняя панель
========================= -->
<div id="topbar">
  <div id="team-info"></div>

  <div id="filters">
    <button class="filter-btn active" data-type="all">Все</button>
    <button class="filter-btn" data-type="quest">Квест</button>
    <button class="filter-btn" data-type="info">Инфо</button>
    <button class="filter-btn" data-type="live">Проживание</button>
    <button class="filter-btn" data-type="finish">Финиш</button>
  </div>
</div>

<!-- =========================
     🗺 Карта
========================= -->
<div id="map-wrapper">
  <div id="map-container">
    <img src="assets/map.svg" id="map" alt="Карта">
    <div id="points-layer"></div>
  </div>
</div>

<!-- =========================
     🔍 Zoom кнопки
========================= -->
<div id="zoom-controls">
  <button class="zoom-btn" id="zoom-in">+</button>
  <button class="zoom-btn" id="zoom-out">−</button>
</div>

<!-- =========================
     📄 Модальное окно
========================= -->
<div id="modal">
  <h2 id="modal-title"></h2>
  <p id="modal-desc"></p>
  <div id="modal-meta"></div>

  <button id="complete-btn" class="modal-btn">
    Отметить как пройдено
  </button>

  <button id="close-btn" class="modal-btn gray">
    Закрыть
  </button>
</div>

<!-- =========================
     🐞 Debug (только для разработки)
========================= -->
<div id="debug"></div>

<!-- =========================
     📦 Скрипты
========================= -->
<script src="telegram.js?v=2"></script>
<script src="main.js?v=2"></script>

<script>
window.onerror = function(msg, url, line) {
  const debug = document.getElementById("debug");
  if (debug) {
    debug.innerHTML += `<div>❌ ${msg} (line ${line})</div>`;
  }
};
</script>

</body>
</html>
