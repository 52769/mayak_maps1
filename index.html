<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>Интерактивная карта</title>

<!-- Telegram WebApp API -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Стили -->
<link rel="stylesheet" href="styles.css" />
</head>

<body>

<!-- =========================
     🧭 ВЕРХНЯЯ ПАНЕЛЬ
========================= -->
<div id="topbar">
  <div id="team-info"></div>

  <div id="filters">
    <button class="filter-btn active" data-type="all">Все</button>
    <button class="filter-btn" data-type="quest">Квест</button>
    <button class="filter-btn" data-type="info">Инфо</button>
    <button class="filter-btn" data-type="live">Проживание</button>
    <button class="filter-btn" data-type="finish">Финиш</button>
  </div>
</div>

<!-- =========================
     🗺 КАРТА
========================= -->
<div id="map-wrapper">
  <div id="map-container">

    <!-- Фон карты -->
    <img src="assets/map.svg" id="map" alt="Карта территории">

    <!-- Слой точек -->
    <div id="points-layer"></div>

  </div>
</div>

<!-- =========================
     🔍 ZOOM
========================= -->
<div id="zoom-controls">
  <button class="zoom-btn">+</button>
  <button class="zoom-btn">−</button>
</div>

<!-- =========================
     📄 МОДАЛКА
========================= -->
<div id="modal">
  <h2 id="modal-title"></h2>
  <p id="modal-desc"></p>
  <div id="modal-meta"></div>

  <button id="complete-btn" class="modal-btn">
    Отметить как пройдено
  </button>

  <button id="close-btn" class="modal-btn gray">
    Закрыть
  </button>
</div>

<!-- =========================
     🚀 SCRIPTS
========================= -->

<!-- Telegram слой -->
<script src="telegram.js"></script>

<!-- Основная логика -->
<script src="main.js"></script>

</body>
</html>
